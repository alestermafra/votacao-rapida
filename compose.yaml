services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votacao-rapida-app
    volumes:
      - .:/var/www/html
    ports:
      - "8000:80"
  mysql:
    image: "mysql:5.7"
    container_name: votacao-rapida-mysql
    environment:
      #MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      #MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    ports:
      - 3306:3306
  mailpit:
    image: "axllent/mailpit:v1.21"
    container_name: votacao-rapida-mailpit
    ports:
      - 8025:8025
      - 1025:1025